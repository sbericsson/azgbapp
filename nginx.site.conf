# AZGB Golf App — nginx server block
# Copy to: /etc/nginx/sites-available/azgb
# Then: sudo ln -s /etc/nginx/sites-available/azgb /etc/nginx/sites-enabled/azgb
# Then: sudo nginx -t && sudo systemctl reload nginx
#
# Replace YOUR_DOMAIN with your actual domain (e.g. golf.example.com)
# After running certbot, it will add the HTTPS block automatically.
# Rate limits (R15). limit_req_zone belongs to the http block; site files are
# included inside http {}, so declaring them at the top of this file works.
limit_req_zone $binary_remote_addr zone=azgb_ai:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=azgb_courses:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=azgb_auth:10m rate=10r/m;


server {
    listen 80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    root /var/www/azgb/dist;
    index index.html;

    # API keys, kept out of git. Create /etc/nginx/azgb-keys.conf (chmod 600) with:
    #   set $openrouter_key "sk-or-...";
    #   set $golfcourse_key "...";
    include /etc/nginx/azgb-keys.conf;


    # PWA: serve .webmanifest with the correct MIME type so Chrome's install prompt works
    types {
        application/manifest+json  webmanifest;
    }

    # Don't cache index.html — must always be fresh so new deploys take effect
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # PWA: service worker must never be cached so updates propagate immediately
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # PWA: manifest must never be cached and needs explicit MIME type
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        default_type application/manifest+json;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Cache hashed JS/CSS/font assets forever (Vite adds content hashes to filenames)
    location ~* \.(js|css|woff2|woff|ttf|svg|png|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ── API server (R13): node server/dist/index.mjs on 127.0.0.1:8787 ──
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;            # live updates (Server-Sent Events)
        proxy_read_timeout 1h;
        client_max_body_size 2m;
    }

    # Sign-in emails: slow down scripted requests before they reach the API
    location = /api/auth/request {
        limit_req zone=azgb_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API proxies (R15): keys are added here and never reach browsers ──
    # Only signed-in organisers and scorers may use them (checked by the API).
    location = /_azgb_auth_check {
        internal;
        proxy_pass http://127.0.0.1:8787/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location = /proxy/openrouter/chat/completions {
        limit_except POST { deny all; }
        auth_request /_azgb_auth_check;
        limit_req zone=azgb_ai burst=10 nodelay;
        proxy_pass https://openrouter.ai/api/v1/chat/completions;
        proxy_set_header Authorization "Bearer $openrouter_key";
        proxy_set_header Host openrouter.ai;
        proxy_set_header Cookie "";
        proxy_ssl_server_name on;
        client_max_body_size 64k;
    }

    location = /proxy/golfcourse/v1/courses {
        limit_except GET { deny all; }
        auth_request /_azgb_auth_check;
        limit_req zone=azgb_courses burst=10 nodelay;
        proxy_pass https://api.golfcourseapi.com/v1/courses$is_args$args;
        proxy_set_header Authorization "Key $golfcourse_key";
        proxy_set_header Host api.golfcourseapi.com;
        proxy_set_header Cookie "";
        proxy_ssl_server_name on;
    }

    # SPA fallback: all unknown paths → index.html (handles React Router client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers. nginx ignores server-level add_header inside any
    # location that sets its own, so the locations above repeat them.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
