# AZGB Golf App — nginx server block
# Copy to: /etc/nginx/sites-available/azgb
# Then: sudo ln -s /etc/nginx/sites-available/azgb /etc/nginx/sites-enabled/azgb
# Then: sudo nginx -t && sudo systemctl reload nginx
#
# Replace YOUR_DOMAIN with your actual domain (e.g. golf.example.com)
# After running certbot, it will add the HTTPS block automatically.

server {
    listen 80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    root /var/www/azgb/dist;
    index index.html;

    # Don't cache index.html — must always be fresh so new deploys take effect
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Cache hashed JS/CSS/font assets forever (Vite adds content hashes to filenames)
    location ~* \.(js|css|woff2|woff|ttf|svg|png|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: all unknown paths → index.html (handles React Router client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
