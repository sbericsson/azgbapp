# Golf Bender API routes and key proxies (production, API on 127.0.0.1:8787).
# Install: sudo cp to /etc/nginx/snippets/, then inside the site's 443 server block:
#   include /etc/nginx/snippets/azgb-api.conf;
# Needs /etc/nginx/conf.d/azgb-limits.conf and /etc/nginx/azgb-keys.conf (chmod 600):
#   set $openrouter_key "sk-or-...";
#   set $golfcourse_key "...";

include /etc/nginx/azgb-keys.conf;

# ── API server (R13): node server/dist/index.mjs on 127.0.0.1:8787 ──
location /api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;            # live updates (Server-Sent Events)
    proxy_read_timeout 1h;
    client_max_body_size 2m;
}

# Sign-in emails: slow down scripted requests before they reach the API
location = /api/auth/request {
    limit_req zone=azgb_auth burst=5 nodelay;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ── API proxies (R15): keys are added here and never reach browsers ──
# Only signed-in organisers and scorers may use them (checked by the API).
location = /_azgb_auth_check {
    internal;
    proxy_pass http://127.0.0.1:8787/api/auth/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
}

location = /proxy/openrouter/chat/completions {
    limit_except POST { deny all; }
    auth_request /_azgb_auth_check;
    limit_req zone=azgb_ai burst=10 nodelay;
    proxy_pass https://openrouter.ai/api/v1/chat/completions;
    proxy_set_header Authorization "Bearer $openrouter_key";
    proxy_set_header Host openrouter.ai;
    proxy_set_header Cookie "";
    proxy_ssl_server_name on;
    client_max_body_size 64k;
}

location = /proxy/golfcourse/v1/search {
    limit_except GET { deny all; }
    auth_request /_azgb_auth_check;
    limit_req zone=azgb_courses burst=10 nodelay;
    # No variables here: they would need a resolver. The query string is passed on as is.
    proxy_pass https://api.golfcourseapi.com/v1/search;
    proxy_set_header Authorization "Key $golfcourse_key";
    proxy_set_header Host api.golfcourseapi.com;
    proxy_set_header Cookie "";
    proxy_ssl_server_name on;
}
