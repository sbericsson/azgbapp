# Golf Bender rate limits (R15). http-level, so they live in conf.d.
# Install: sudo cp nginx/conf.d/azgb-limits.conf /etc/nginx/conf.d/
limit_req_zone $binary_remote_addr zone=azgb_ai:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=azgb_courses:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=azgb_auth:10m rate=10r/m;
